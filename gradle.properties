#Tue Mar 02 13:15:33 GMT+08:00 2021
# AGP 8 时代的 opt-out 属性（enableJetifier/nonFinalResIds/resvalues 等 7 项）已删除，
# AGP 9 默认值即推荐值（AGP 10 将移除这些属性）；仅保留 AGP 9 仍支持且无默认等价的条目
android.nonTransitiveRClass=true
android.useAndroidX=true
ksp.incremental=true
ksp.incremental.log=true
ksp.incremental.intermodule=true
isModule=true
org.gradle.jvmargs=-Xmx2048M -Dkotlin.daemon.jvm.options\="-Xmx2048M"
android.uniquePackageNames=false
# useConstraints 已移除：AGP 9 默认 false（仅应用的 androidTest 用约束），
# 且 useConstraints=true 会触发 excludeLibraryComponentsFromConstraints 性能建议警告
android.r8.strictFullModeForKeepRules=false
# optimizedResourceShrinking 默认已为 true，显式 false 在 AGP 9.2 弃用（AGP 10 移除），直接删除改用默认
