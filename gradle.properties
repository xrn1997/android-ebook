## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
#Tue Mar 02 13:15:33 GMT+08:00 2021
# AGP 8 时代的 opt-out 属性（enableJetifier/nonFinalResIds/resvalues 等 7 项）已删除，
# AGP 9 默认值即推荐值（AGP 10 将移除这些属性）；仅保留 AGP 9 仍支持且无默认等价的条目
android.nonTransitiveRClass=true
android.useAndroidX=true
ksp.incremental=true
ksp.incremental.log=true
ksp.incremental.intermodule=true
# 提交态 = 集成构建（module_app 依赖全部功能模块）。
# 单模块独立调试：把本行临时改为 isModule=true，调试完改回，不要提交。
# 不要用 ./gradlew -PisModule=true 覆盖：命令行 -P 会渗进 settings.gradle.kts 的
# includeBuild(lib-common-build)，让 lib_common 也按独立模块去套
# com.android.application，与它的 library 插件冲突而构建失败
# （'com.android.application' and 'com.android.library' plugins cannot be applied in the same project）
isModule=false
org.gradle.jvmargs=-Xmx2048M -Dkotlin.daemon.jvm.options\="-Xmx2048M"
android.uniquePackageNames=false
# useConstraints 已移除：AGP 9 默认 false（仅应用的 androidTest 用约束），
# 且 useConstraints=true 会触发 excludeLibraryComponentsFromConstraints 性能建议警告
android.r8.strictFullModeForKeepRules=false
# optimizedResourceShrinking 默认已为 true，显式 false 在 AGP 9.2 弃用（AGP 10 移除），直接删除改用默认
