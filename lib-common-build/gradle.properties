# 与主构建（android-ebook）一致：已启用 AGP 9 内置 Kotlin（built-in Kotlin），
# 不再需要 builtInKotlin/newDsl opt-out 开关。
# 说明：约定插件（android-ebook 的 build-logic）已移除 org.jetbrains.kotlin.android 应用，
#       顶层 kotlin { } 扩展由 AGP 内置 Kotlin 注册，模块 Kotlin 配置无需改动。
# 迷你构建是独立 Gradle 构建，不读主构建的 jvmargs；默认 512M 堆在 KSP 阶段会 Metaspace 溢出
org.gradle.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options\="-Xmx2048M"
